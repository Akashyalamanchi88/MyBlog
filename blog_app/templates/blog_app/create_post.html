{% extends "blog_app/base.html" %}


{% block title %}
Create Post | MyBlog
{% endblock %}



{% block css %}

<style>


/* ================= CREATE POST ================= */


.create-post-container {

    max-width: 700px;
    margin: 40px auto;
    background: white;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);

}



.create-post-container h2 {

    text-align: center;
    color: #2563eb;
    margin-bottom: 30px;
    font-size: 30px;

}




/* FORM */


form p {

    margin-bottom: 20px;

}



form label {

    display: block;
    font-weight: 600;
    margin-bottom: 8px;
    color: #374151;

}



input,
textarea,
select {


    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    transition: 0.3s;

}



input:focus,
textarea:focus,
select:focus {

    border-color: #2563eb;
    box-shadow: 0 0 5px rgba(37,99,235,0.3);

}




textarea {

    min-height: 180px;
    resize: vertical;

}




/* BUTTON */


.create-btn {


    width: 100%;
    background: #2563eb;
    color:white;
    padding: 14px;
    border:none;
    border-radius:8px;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;


}



.create-btn:hover {

    background:#1d4ed8;

}




</style>


{% endblock %}





{% block content %}



<div class="create-post-container">


    <h2>
        Create New Post
    </h2>



    <form method="POST" enctype="multipart/form-data">


        {% csrf_token %}



        {{ form.as_p }}



        <button type="submit" class="create-btn">

            Create Post

        </button>



    </form>



</div>



{% endblock %}
