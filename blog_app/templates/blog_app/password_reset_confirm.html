{% extends "blog_app/base.html" %}





{% block title %}
Email Sent | MyBlog
{% endblock %}






{% block css %}

<style>


/* ================= EMAIL SENT PAGE ================= */


.email-container {


    max-width:550px;
    margin:70px auto;
    background:white;
    padding:40px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);


}






.email-container h2 {


    color:#2563eb;
    font-size:32px;
    margin-bottom:20px;


}






.email-container p {


    color:#4b5563;
    font-size:17px;
    line-height:1.6;


}




.success-icon {


    font-size:50px;
    margin-bottom:20px;


}



</style>


{% endblock %}








{% block content %}





<div class="email-container">





    <div class="success-icon">

        📧

    </div>





    <h2>

        Email Sent

    </h2>






    <p>

        If the email exists, a password reset link has been sent.

    </p>






</div>





{% endblock %}
