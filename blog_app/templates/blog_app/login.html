{% extends "blog_app/base.html" %}




{% block title %}
Login | MyBlog
{% endblock %}





{% block css %}

<style>


/* ================= LOGIN PAGE ================= */


.login-container {


    max-width:450px;
    margin:60px auto;
    background:white;
    padding:35px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);


}




.login-container h2 {


    text-align:center;
    color:#2563eb;
    font-size:32px;
    margin-bottom:30px;


}





/* FORM */


.login-container form p {


    margin-bottom:20px;


}



.login-container label {


    display:block;
    font-weight:600;
    margin-bottom:8px;
    color:#374151;


}



.login-container input {


    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:15px;
    outline:none;
    transition:0.3s;


}




.login-container input:focus {


    border-color:#2563eb;
    box-shadow:0 0 5px rgba(37,99,235,0.3);


}




/* LOGIN BUTTON */


.login-btn {


    width:100%;
    padding:13px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;


}



.login-btn:hover {


    background:#1d4ed8;


}







/* LINKS */


.login-links {


    text-align:center;
    margin-top:20px;


}



.login-links a {


    color:#2563eb;
    text-decoration:none;
    font-weight:600;


}



.login-links a:hover {


    text-decoration:underline;


}







</style>


{% endblock %}








{% block content %}





<div class="login-container">



    <h2>
        Login
    </h2>





    <form method="POST">


        {% csrf_token %}





        {{ form.as_p }}






        <button type="submit" class="login-btn">

            Login

        </button>





    </form>






    <div class="login-links">





        <br>


        <a href="{% url 'password_reset' %}">

            Forgot Password?

        </a>





        <br><br>





        <p>

            Don't have an account?

            <a href="{% url 'register' %}">

                Register here

            </a>


        </p>




    </div>





</div>





{% endblock %}
