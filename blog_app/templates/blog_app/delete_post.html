{% extends "blog_app/base.html" %}



{% block title %}
Delete Post | MyBlog
{% endblock %}




{% block css %}

<style>


/* ================= DELETE POST ================= */


.delete-container {

    max-width: 550px;
    margin: 60px auto;
    background: white;
    padding: 35px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);

}



.delete-container h2 {

    color: #dc2626;
    font-size: 30px;
    margin-bottom: 20px;

}



.delete-container p {

    font-size: 17px;
    color: #4b5563;
    margin-bottom: 30px;

}



.delete-container strong {

    color: #111827;

}



/* DELETE BUTTON */


.delete-btn {


    background:#dc2626;
    color:white;
    border:none;
    padding:12px 30px;
    border-radius:8px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;


}



.delete-btn:hover {

    background:#b91c1c;

}




/* CANCEL BUTTON */


.cancel-btn {


    display:inline-block;
    margin-left:15px;
    padding:12px 30px;
    background:#6b7280;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-size:16px;
    transition:0.3s;


}



.cancel-btn:hover {

    background:#4b5563;

}



</style>


{% endblock %}







{% block content %}



<div class="delete-container">



    <h2>
        Delete Post
    </h2>



    <p>
        Are you sure you want to delete 
        <strong>"{{ post.title }}"</strong>?
    </p>




    <form method="POST">


        {% csrf_token %}



        <button type="submit" class="delete-btn">

            Delete

        </button>



        <a href="{% url 'home' %}" class="cancel-btn">

            Cancel

        </a>



    </form>



</div>




{% endblock %}
