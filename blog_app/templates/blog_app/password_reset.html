{% extends "blog_app/base.html" %}





{% block title %}
Forgot Password | MyBlog
{% endblock %}






{% block css %}

<style>


/* ================= FORGOT PASSWORD ================= */


.forgot-container {


    max-width:500px;
    margin:60px auto;
    background:white;
    padding:35px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
    text-align:center;


}





.forgot-container h2 {


    color:#2563eb;
    font-size:32px;
    margin-bottom:15px;


}





.forgot-container p {


    color:#4b5563;
    font-size:16px;
    margin-bottom:25px;


}





/* FORM */


.forgot-container form p {


    text-align:left;
    margin-bottom:20px;


}




.forgot-container label {


    display:block;
    font-weight:600;
    color:#374151;
    margin-bottom:8px;


}




.forgot-container input {


    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:15px;
    outline:none;
    transition:0.3s;


}




.forgot-container input:focus {


    border-color:#2563eb;
    box-shadow:0 0 5px rgba(37,99,235,0.3);


}





/* BUTTON */


.reset-btn {


    width:100%;
    padding:13px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;


}




.reset-btn:hover {


    background:#1d4ed8;


}




</style>


{% endblock %}








{% block content %}






<div class="forgot-container">





    <h2>

        Forgot Password

    </h2>






    <p>

        Enter your registered email address.

    </p>






    <form method="POST">


        {% csrf_token %}



        {{ form.as_p }}




        <button type="submit" class="reset-btn">

            Send Reset Link

        </button>




    </form>





</div>





{% endblock %}
